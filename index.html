<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F8F4EA">
    <meta name="description" content="Ask. Seek. Receive. A quiet moment with Scripture.">
    <title>Ask. Seek. Receive.</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="app">

        <header class="header">
            <!-- Secret Love Note -->
            <div class="love-note-trigger">
                <button id="loveHeart" class="love-heart" aria-label="Hold for a little secret" type="button">
                    ♡
                </button>
            </div>

            <!-- Love Note Popup -->
            <div id="loveNote" class="love-note" role="dialog" aria-modal="true" aria-label="A little note">
                <div class="love-note-content">
                    <button id="closeLoveNote" class="close-love-note" aria-label="Close" type="button">
                        ×
                    </button>

                    <div class="love-note-heart">♡</div>

                    <p class="love-note-title">
                        Dear Ann
                    </p>

                    <p class="love-note-message">
                        I choose you, I cherish you, and I’ll keep choosing you—every single day. 🤍
                    </p>

                    <p class="love-note-signature">
                        — jbn
                    </p>
                </div>
            </div>


            <!-- Main Title -->
            <header class="hero-header">
                <h1>Ask. Seek. Receive.</h1>

                <p>Let His Word guide you.</p>
            </header>
            ```

            <h1>Ask. Seek. Receive.</h1>
            <p>Let His Word guide you.</p>
        </header>

        <div class="language-toggle" role="group" aria-label="Language selection">
            <button type="button" class="language active" data-language="en">EN</button>
            <span aria-hidden="true">·</span>
            <button type="button" class="language" data-language="ml">ML</button>
        </div>

        <section class="experience" aria-live="polite">

            <div class="light-aura" aria-hidden="true"></div>

            <button id="divineButton" class="divine-button" type="button" aria-label="Ask for a Bible verse">
                <span class="button-symbol" aria-hidden="true">✦</span>
                <span class="button-label">Ask</span>
            </button>

            <div id="verseContainer" class="verse-container" aria-hidden="true">
                <blockquote id="verseText"></blockquote>
                <p id="verseReference" class="verse-reference"></p>
            </div>

        </section>

    </main>

    <script src="verses.js"></script>
    <script src="script.js?v=1.0.2"></script>
</body>

</html>
